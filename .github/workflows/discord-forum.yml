name: Discord Forum Commit Log

on:
  push:
    branches:
      - master # 메인 브랜치에 푸시될 때만 작동 (원하는 브랜치명으로 수정 가능)

jobs:
  post-to-discord-forum:
    runs-on: ubuntu-latest
    steps:
      - name: Send Commit to Discord Forum
        run: |
          # 1. 커밋 메시지에서 첫 줄만 추출
          COMMIT_TITLE=$(echo "${{ github.event.head_commit.message }}" | head -n 1)
          
          # 2. 레포지토리 이름 가져오기
          REPO_NAME="${{ github.event.repository.name }}"
          
          # 3. 한국 시간(KST) 기준으로 현재 날짜/시간 가져오기
          COMMIT_DATE=$(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M')
          
          # 4. 제안한 깔끔한 블로그 포맷으로 조립 (엔터로 줄바꿈 유지)
          JSON_PAYLOAD=$(jq -n \
            --arg title "[$REPO_NAME] 🚀 $COMMIT_TITLE" \
            --arg content "**[ 레포지토리 이름 ]** $REPO_NAME
            **[   D A T E   ]** $COMMIT_DATE
            **[ C O M M I T ]** $COMMIT_TITLE
            **[ W R I T E R ]** [${{ github.actor }}](https://github.com/${{ github.actor }})
            **[ COMMIT LINK ]** [자세히 보기](${{ github.event.head_commit.url }})
            
            #$REPO_NAME" \
            '{thread_name: $title, content: $content}')
            
          # 5. 디스코드 웹훅으로 데이터 전송
          curl -H "Content-Type: application/json" \
               -d "$JSON_PAYLOAD" \
               ${{ secrets.DISCORD_WEBHOOK }}